[tool.poetry]
name = "yolov8-car-counter"
version = "0.1.0"
description = "YOLOv8 car detection + tracking in polygonal ROI, writes annotated video"
authors = ["Dmitrii Valedinskii <dmvaled@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "carcntr", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
ultralytics = "^8.0"
opencv-python = "^4.7"
torch = "2.2.2"
numpy = "^1.26"
shapely = "^2.1"
loguru = "^0.7"
tqdm = "^4.65"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0.1"
ruff = "^0.13.1"
black = "^24.2.0"
mypy = "^1.18.2"

[tool.poetry.group.test.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry-core>=2.2.1"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "Q",
  "C4",
  "SIM",
]
ignore = []

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
